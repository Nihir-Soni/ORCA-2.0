services:
  - type: web
    name: orca-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ORCA_CORS_ORIGINS
        sync: false
      - key: ORCA_DATA_MODE
        value: LIVE
      - key: ORCA_LIVE_TIMEOUT
        value: "4.0"
      - key: GROQ_API_KEY
        sync: false
      - key: ORCA_GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: openai/gpt-oss-20b
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_TIMEOUT_SECONDS
        value: "8"
      - key: COPERNICUS_USERNAME
        sync: false
      - key: COPERNICUS_PASSWORD
        sync: false
